name: 24/7 Earthquake & News Telegram Bot

on:
  schedule:
    # 10분마다 자동 실행 (GitHub Actions UTC 기준)
    - cron: '*/10 * * * *'
  workflow_dispatch: # 필요 시 수동 실행 버튼 활성화

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v3

      - name: 파이썬 3.10 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필수 패키지 설치
        run: |
          pip install requests beautifulsoup4 feedparser

      - name: 봇 실행 (지진 감시 및 정시 뉴스 발송)
        run: |
          python bot.py

      - name: 발송 이력(JSON) 자동 저장 및 커밋
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_earthquakes.json last_run_state.json
          git commit -m "Auto-update sent states [skip ci]" || exit 0
          git push
